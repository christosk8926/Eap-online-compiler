<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAP Pseudocode Interpreter</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script>
        // Inline script to prevent FOUC (Flash of Unstyled Content) / wrong theme
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme); // Set on html/root if possible or body
            // Since body might not exist yet in head, set on documentElement usually works for CSS vars if :root uses them
            // But my CSS uses [data-theme] on body?
            // Let's check style.css.
            // [data-theme="dark"] matches body.
            // If I set it on document.documentElement (html), does it inherit?
            // If CSS is [data-theme="dark"] { ... }, it matches whatever element has it.
            // If vars are defined in :root, and overwritten in [data-theme="dark"],
            // putting it on <html> is better.

            // Wait, style.css:
            // [data-theme="dark"] { ... variables ... }
            // body { ... background-color: var(--bg-color); ... }

            // If I put data-theme on <html>, the variables will apply to <html> and inherit to <body>.
            // This is standard.
            // But I need to ensure `app.v5.js` and `index.html` use the same element.
            // `index.html` sets it on `body`.
            // `app.v5.js` sets it on `body`.

            // I should probably stick to `body` but since `body` isn't parsed yet...
            // I can wait for DOMContentLoaded? No, that defeats the purpose.
            // I can try `document.documentElement` and update CSS to match `:root[data-theme="dark"]` OR `[data-theme="dark"]`.
            // Actually, `[data-theme="dark"]` matches html tag too.
            // So variables will be set on html. Body inherits variables.
            // So setting on documentElement is safer in head.

            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <header>
        <a href="index.html" class="home-link">&larr; Home</a>
        <h1>EAP Online Interpreter</h1>
        <button id="theme-toggle">🌙 Dark Mode</button>
    </header>
    <main>
        <div class="container">
            <div class="editor-container">
                <div class="panel-header">
                    <span>Κώδικας Ψευδογλώσσας</span>
                    <select id="example-selector">
                        <option value="" disabled selected>Επιλέξτε Παράδειγμα...</option>
                        <option value="HELLO">Hello World</option>
                        <option value="FIBONACCI">Fibonacci</option>
                        <option value="BUBBLE_SORT">Ταξινόμηση Φυσαλίδας</option>
                        <option value="AVERAGE">Μέσος Όρος</option>
                    </select>
                </div>
                <div class="editor-wrapper">
                    <div id="line-numbers">1</div>
                    <div class="code-area">
                        <pre id="highlighting" aria-hidden="true"><code id="highlighting-content"></code></pre>
                        <textarea id="code-editor" placeholder="Επικολλήστε τον κώδικά σας εδώ..." spellcheck="false"></textarea>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="run-button">▶ ΕΚΤΕΛΕΣΗ</button>
                <div class="secondary-controls">
                    <button id="save-button">💾 ΑΠΟΘΗΚΕΥΣΗ</button>
                    <button id="clear-button">🗑️ ΚΑΘΑΡΙΣΜΟΣ</button>
                </div>
            </div>

            <div class="resizer" id="drag-handle"></div>

            <div class="output-container">
                <div class="panel-header">Αποτέλεσμα / Terminal</div>
                <div id="terminal-window">
                    <div id="terminal-output"></div>
                    <div id="terminal-input-line" style="display: none;">
                        <span id="terminal-prompt">&gt;</span>
                        <input type="text" id="terminal-input" autocomplete="off" spellcheck="false">
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer><p>Ένας custom-made compiler για τον αγαπητό φοιτητή του ΕΑΠ</p></footer>
    <script src="core.v5.js"></script>
    <script src="app.v5.js"></script>
</body>
</html>
